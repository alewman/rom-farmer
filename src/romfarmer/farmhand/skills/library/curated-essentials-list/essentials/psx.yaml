# PSX Essentials — culturally significant titles that transcend ratings
#
# PSX has excellent Western coverage, but some JP-only titles and
# PAL exclusives are worth preserving regardless of budget constraints.

games:
  # --- Japan-only / underrated ---
  - name: "Tobal No. 2 (Japan)"
    pattern: "Tobal No. 2*Japan*"
    region: JP
    category: masterpiece
    reason: "DreamFactory/Square fighting game with revolutionary quest mode. Never left JP."

  - name: "Harmful Park (Japan)"
    pattern: "Harmful Park*Japan*"
    region: JP
    category: hidden-gem
    reason: "Brilliant comedic shmup. Rare and beloved. JP-exclusive."

  - name: "Rakugaki Showtime (Japan)"
    pattern: "Rakugaki Showtime*Japan*"
    region: JP
    category: hidden-gem
    reason: "Treasure's party fighter. Doodle aesthetic. Rare Treasure oddity."

  - name: "LSD - Dream Emulator (Japan)"
    pattern: "LSD*Dream Emulator*Japan*"
    region: JP
    category: historical
    reason: "One of the most unique games ever made. Art game decades ahead of its time."

  - name: "Tail Concerto (Japan)"
    pattern: "Tail Concerto*Japan*"
    region: JP
    category: hidden-gem
    reason: "CyberConnect's charming 3D platformer. Precursor to Solatorobo."

  # --- Must-haves regardless of rating ---
  - name: "Castlevania - Symphony of the Night"
    pattern: "Castlevania*Symphony*Night*"
    region: US
    category: masterpiece
    reason: "Defined 'Metroidvania'. One of the most influential games of all time."

  - name: "Final Fantasy Tactics"
    pattern: "Final Fantasy Tactics*USA*"
    region: US
    category: masterpiece
    reason: "Matsuno's tactical masterpiece. Deep political narrative."

  - name: "Vagrant Story"
    pattern: "Vagrant Story*"
    region: US
    category: masterpiece
    reason: "Matsuno again. One of the PS1's most technically ambitious games."

  - name: "Suikoden II"
    pattern: "Suikoden II*"
    region: US
    category: masterpiece
    reason: "Widely considered the greatest JRPG narrative on PS1."

  - name: "Xenogears"
    pattern: "Xenogears*"
    region: US
    category: masterpiece
    reason: "Ambitious sci-fi RPG. Disc 2 was rushed but the vision is unmatched."

  - name: "Valkyrie Profile"
    pattern: "Valkyrie Profile*"
    region: US
    category: masterpiece
    reason: "Tri-Ace's Norse mythology RPG. Unique battle system and narrative structure."

  - name: "Einhander"
    pattern: "Einhander*"
    region: US
    category: hidden-gem
    reason: "Squaresoft shmup. Gorgeous 2.5D. Overlooked in their RPG-dominated catalog."

  - name: "Tomba!"
    pattern: "Tomba*"
    region: US
    category: hidden-gem
    reason: "Whoopee Camp's cult platformer. Creative quest-based progression."
