steps:
  - id: load_list
    action: python
    description: Load the essentials list for the requested platform
    code: |
      import yaml
      from pathlib import Path
      skill_dir = Path(__file__).parent
      list_file = skill_dir / "essentials" / "{{platform}}.yaml"
      if list_file.exists():
          data = yaml.safe_load(list_file.read_text())
          games = data.get("games", [])
      else:
          games = []
    outputs: [games]

  - id: show_list
    action: conditional
    description: Display the essentials list
    condition: "{{action}} == 'show'"

  - id: apply_to_build
    action: conditional
    description: Apply essentials as a keep-list overlay on a rom-farmer build
    condition: "{{action}} == 'apply'"

  - id: add_games
    action: conditional
    description: Add new games to the essentials list
    condition: "{{action}} == 'add'"
