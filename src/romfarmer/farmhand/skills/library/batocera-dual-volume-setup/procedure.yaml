steps:
  - id: connect
    action: mcp_call
    description: Connect to the Batocera target
    tool: farmhand_connect
    args:
      host: "{{host}}"

  - id: verify_mount
    action: ssh
    description: Verify secondary volume is mounted
    command: "mountpoint -q {{secondary_mount}} && echo 'MOUNTED' || echo 'NOT_MOUNTED'"
    outputs: [mount_status]

  - id: check_mount
    action: conditional
    description: Abort if secondary volume is not mounted
    condition: "{{mount_status}} == 'MOUNTED'"
    on_failure: abort

  - id: upload_script
    action: mcp_call
    description: Upload the setup script to the target
    tool: farmhand_remote_exec
    args:
      host: "{{host}}"
      command: "cat > /tmp/setup-rom-symlinks.sh"

  - id: run_setup
    action: ssh
    description: Run the symlink setup script for specified platforms
    command: "chmod +x /tmp/setup-rom-symlinks.sh && /tmp/setup-rom-symlinks.sh {{secondary_mount}} {{platforms_to_move}}"
    expect_exit: 0

  - id: verify
    action: ssh
    description: Verify symlinks are correct
    command: "ls -la /userdata/roms/ | grep '^l'"
    outputs: [symlink_listing]
