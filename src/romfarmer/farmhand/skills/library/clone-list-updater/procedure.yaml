steps:
  - id: diff_dats
    action: mcp_call
    description: Compare old and new DAT versions by hash to detect renames, additions, removals
    tool: clonelist_diff
    args:
      old_dat: "{{old_dat}}"
      new_dat: "{{new_dat}}"
    outputs: [diff_result]

  - id: validate_clonelist
    action: mcp_call
    description: Check all clone list searchTerms against the new DAT — find broken references
    tool: clonelist_validate
    args:
      clonelist: "{{clonelist}}"
      dat_file: "{{new_dat}}"
    outputs: [validation_result]

  - id: review_changes
    action: prompt
    description: >
      Review the diff and validation results. Check renames for correctness.
      Look at unmatched searchTerms — are they caused by renames in the diff,
      or pre-existing issues? Decide which patches to apply.

  - id: patch_dryrun
    action: mcp_call
    description: Preview clone list patches without applying (dry run)
    tool: clonelist_patch
    args:
      clonelist: "{{clonelist}}"
      old_dat: "{{old_dat}}"
      new_dat: "{{new_dat}}"
      dry_run: true
    outputs: [patch_preview]

  - id: approve_patches
    action: prompt
    description: >
      Review the proposed patches. Each shows the old and new searchTerm
      plus the reason (title correction, punctuation fix, etc.).
      Approve to apply, or adjust dry_run=false to proceed.

  - id: apply_patches
    action: mcp_call
    description: Apply approved patches to the clone list
    tool: clonelist_patch
    args:
      clonelist: "{{clonelist}}"
      old_dat: "{{old_dat}}"
      new_dat: "{{new_dat}}"
      dry_run: "{{dry_run}}"
    outputs: [patch_result]
    condition: "{{dry_run}} == false"

  - id: generate_metadata
    action: mcp_call
    description: Auto-generate Retool metadata from the new DAT filenames
    tool: clonelist_metadata_generate
    args:
      dat_file: "{{new_dat}}"
      output: "{{metadata_output}}"
    condition: "{{metadata_output}} != ''"
    outputs: [metadata_result]

  - id: summary
    action: prompt
    description: >
      Summarize what was done: renames detected, patches applied,
      remaining unmatched terms that need manual attention, and
      metadata coverage. Recommend next steps for any gaps.
