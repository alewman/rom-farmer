[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "romfarmer"
version = "2.0.0"
description = "Content-addressed build compiler for ROM collections, designed to be driven by an AI agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Aubrey Lewman"}
]
keywords = ["rom", "emulation", "no-intro", "redump", "1g1r", "mcp", "batocera", "retrobat", "content-addressable"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Archiving",
]

dependencies = [
    "click>=8.1.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.0",
    "pillow>=10.0.0",
    "py7zr>=0.20.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.6",
    "mypy>=1.8.0",
    "types-pyyaml",
    "import-linter>=2.1",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]
farmhand = [
    "paramiko>=3.4.0",
]
optimizer = [
    "langgraph>=0.2",
    "openai>=1.40",
]

[project.urls]
Homepage = "https://github.com/alewman/rom-farmer"
Issues = "https://github.com/alewman/rom-farmer/issues"

[project.scripts]
romfarmer = "romfarmer.cli:cli"
romfarmer-intent-mcp = "romfarmer.intent.mcp:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
romfarmer = [
    "py.typed",
    "farmhand/skills/library/**/*",
    "web/templates/**/*",
    "web/static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as an asyncio test",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=romfarmer",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by the formatter)
    "C901",  # complexity — tracked as a refactor target, not a CI gate
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]  # pytest.raises(Exception) is deliberate in invariant tests
"scripts/**" = ["E402", "E722", "B007", "B904"]  # one-off operator scripts

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "romfarmer.ir.*"
strict = true

[[tool.mypy.overrides]]
module = "romfarmer.engine.*"
strict = true

[[tool.mypy.overrides]]
module = "romfarmer.analysis.*"
strict = true

[[tool.mypy.overrides]]
module = "romfarmer.planner.*"
strict = true

[[tool.mypy.overrides]]
module = "romfarmer.engine.transforms.source"
strict = true

[[tool.mypy.overrides]]
module = "romfarmer.driver.*"
strict = true

[[tool.mypy.overrides]]
module = "romfarmer.intent.*"
strict = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[tool.importlinter]
root_package = "romfarmer"

[[tool.importlinter.contracts]]
name = "romfarmer.ir must not import from legacy romfarmer modules"
type = "forbidden"
source_modules = [
    "romfarmer.ir.identity",
    "romfarmer.ir.catalog",
    "romfarmer.ir.actions",
    "romfarmer.ir.layout",
    "romfarmer.ir.manifest",
]
forbidden_modules = [
    "romfarmer.stages",
    "romfarmer.cache",
    "romfarmer.config",
    "romfarmer.core",
    "romfarmer.metadata",
    "romfarmer.analysis",
    "romfarmer.planner",
    "romfarmer.engine",
    "romfarmer.targets",
    "romfarmer.cli",
]

[[tool.importlinter.contracts]]
name = "romfarmer.planner.passes must not import from legacy romfarmer modules"
type = "forbidden"
source_modules = [
    "romfarmer.planner.passes.region",
    "romfarmer.planner.passes.dat_dedup",
    "romfarmer.planner.passes.one_g_one_r",
    "romfarmer.planner.passes.arcade",
    "romfarmer.planner.passes.rating",
    "romfarmer.planner.passes.curated_lists",
    "romfarmer.planner.passes.generation",
    "romfarmer.planner.passes.budget",
]
forbidden_modules = [
    "romfarmer.stages",
    "romfarmer.cache",
    "romfarmer.config",
    "romfarmer.core",
    "romfarmer.metadata",
]

[[tool.importlinter.contracts]]
name = "romfarmer.analysis must not import from stages (Phase 5: stages deleted)"
type = "forbidden"
source_modules = [
    "romfarmer.analysis.catalog_builder",
    "romfarmer.analysis.knowledge",
]
forbidden_modules = [
    "romfarmer.stages",
    "romfarmer.plugins",
]

[[tool.importlinter.contracts]]
name = "romfarmer.targets must not import from stages or plugins"
type = "forbidden"
source_modules = [
    "romfarmer.targets.profiles.loader",
    "romfarmer.targets.emitters.generic",
    "romfarmer.targets.emitters.es_gamelist",
    "romfarmer.targets.emitters.extras",
    "romfarmer.targets.emitters.materializer",
]
forbidden_modules = [
    "romfarmer.stages",
    "romfarmer.plugins",
]

[[tool.importlinter.contracts]]
name = "hermetic core is model-free (intent brief v2 §7, Contract 5)"
type = "forbidden"
source_modules = [
    "romfarmer.ir",
    "romfarmer.analysis",
    "romfarmer.planner",
    "romfarmer.engine",
    "romfarmer.targets",
    "romfarmer.config",
    "romfarmer.driver",
]
forbidden_modules = [
    "romfarmer.ai",
    "romfarmer.mcp",
    "romfarmer.intent",
    "romfarmer.farmhand.optimizer",
]

[[tool.importlinter.contracts]]
name = "planner must not import the config layer (format negotiation lives in driver.resolve)"
type = "forbidden"
source_modules = ["romfarmer.planner"]
forbidden_modules = ["romfarmer.config", "romfarmer.driver", "romfarmer.cli"]

[[tool.importlinter.contracts]]
name = "targets must not import planner (FormatChain lives in ir.chain)"
type = "forbidden"
source_modules = ["romfarmer.targets"]
forbidden_modules = ["romfarmer.planner", "romfarmer.driver", "romfarmer.cli"]

[[tool.importlinter.contracts]]
name = "intent surface is read-only (never the operator MCP server, farmhand, or the CLI)"
type = "forbidden"
source_modules = ["romfarmer.intent"]
forbidden_modules = ["romfarmer.mcp", "romfarmer.mcp_server", "romfarmer.farmhand", "romfarmer.cli", "romfarmer.ai"]
