[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "romfarmer"
version = "2.0.0"
description = "Enterprise-grade ROM collection management system - Cultivate the perfect ROM collection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ROM Farmer Team"}
]
keywords = ["rom", "emulation", "no-intro", "redump", "organization", "farming", "collection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.1.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.0",
    "pillow>=10.0.0",
    "py7zr>=0.20.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.12.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "types-pyyaml",
    "import-linter>=2.1",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]
farmhand = [
    "paramiko>=3.4.0",
]
optimizer = [
    "langgraph>=0.2",
    "openai>=1.40",
]

[project.scripts]
romfarmer = "romfarmer.cli:cli"

# Plugin entry points — third-party packages can add plugins here
# by declaring their own [project.entry-points."romfarmer.plugins"] section
[project.entry-points."romfarmer.plugins"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as an asyncio test",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=romfarmer",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "romfarmer.ir.*"
strict = true

[[tool.mypy.overrides]]
module = "romfarmer.engine.*"
strict = true

[[tool.mypy.overrides]]
module = "romfarmer.analysis.*"
strict = true

[[tool.mypy.overrides]]
module = "romfarmer.planner.*"
strict = true

[[tool.mypy.overrides]]
module = "romfarmer.engine.transforms.source"
strict = true

[tool.importlinter]
root_package = "romfarmer"

[[tool.importlinter.contracts]]
name = "romfarmer.ir must not import from legacy romfarmer modules"
type = "forbidden"
source_modules = [
    "romfarmer.ir.identity",
    "romfarmer.ir.catalog",
    "romfarmer.ir.actions",
    "romfarmer.ir.layout",
    "romfarmer.ir.manifest",
]
forbidden_modules = [
    "romfarmer.stages",
    "romfarmer.cache",
    "romfarmer.config",
    "romfarmer.core",
    "romfarmer.metadata",
    "romfarmer.analysis",
    "romfarmer.planner",
    "romfarmer.engine",
    "romfarmer.targets",
    "romfarmer.cli",
]

[[tool.importlinter.contracts]]
name = "romfarmer.planner.passes must not import from legacy romfarmer modules"
type = "forbidden"
source_modules = [
    "romfarmer.planner.passes.region",
    "romfarmer.planner.passes.dat_dedup",
    "romfarmer.planner.passes.one_g_one_r",
    "romfarmer.planner.passes.arcade",
    "romfarmer.planner.passes.rating",
    "romfarmer.planner.passes.curated_lists",
    "romfarmer.planner.passes.generation",
    "romfarmer.planner.passes.budget",
]
forbidden_modules = [
    "romfarmer.stages",
    "romfarmer.cache",
    "romfarmer.config",
    "romfarmer.core",
    "romfarmer.metadata",
]

# NOTE (Phase 4 TODO): romfarmer.analysis.* intentionally imports from
# romfarmer.dat_parser (CatalogBuilder → ROMMatcher) — correct bridge
# behaviour — so no isolation contract is added yet.  Add one here once
# analysis/ scope is final and all permitted legacy imports are enumerated.
