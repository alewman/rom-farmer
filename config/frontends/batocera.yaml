# =============================================================================
# COMPRESSION GUIDE
# =============================================================================
# chd  - Disc systems (PSX, PS2, Saturn, Dreamcast, PCE-CD, Mega CD, etc.)
# rvz  - GameCube/Wii (Dolphin native)
# cso  - PSP (PPSSPP native)
# 7z   - Cartridge/ROM systems (emulators decompress on-the-fly)
# none - Modern/complex systems or formats that don't compress well

# =============================================================================
# DEFAULTS
# =============================================================================
defaults:
  organization: flat
  metadata: true
