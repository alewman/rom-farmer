# Batocera Frontend Configuration
# Generated from batocera.linux es_systems.yml (6268 lines, 259 systems)
# Source: https://github.com/batocera-linux/batocera.linux
# Full-featured retro gaming distribution for x86_64 and high-powered ARM

name: batocera
description: "Batocera Linux - Full-featured retro gaming distribution"

# =============================================================================
# FOLDER MAPPING
# Maps internal platform names to Batocera folder names
# Only list differences from internal names
# =============================================================================
folder_mapping:
  pcecd: pcenginecd
  turbografxcd: pcenginecd
  segacd: megacd
  pspminis: psp/pspminis
  sgb-gbc: sgb
  atarijaguar: jaguar
  atarilynx: lynx
  odyssey2: o2em
  bbc: bbcmicro

# =============================================================================
# MEDIA SUPPORT
# =============================================================================
media_support:
  - image           # Box art, screenshots
  - mix             # Combined artwork (miximage)
  - wheel           # Logo wheels
  - marquee         # Marquee images
  - video           # Video previews
  - manual          # PDF manuals
  - cartridge       # 3D cartridge renders
  - fanart          # Fan artwork
  - titlescreen     # Title screen captures
  - boxback         # Back of box images

# =============================================================================
# PLATFORM CONFIGURATIONS
# 189 ROM-based platforms + 70 ports/engines = 259 total Batocera systems
# Extensions sourced from Batocera's es_systems.yml (authoritative)
# =============================================================================
