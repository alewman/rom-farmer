# No-Intro cartridge platforms → 7z compression
# Applies to all cartridge-based systems from No-Intro DAT sets
# These platforms: extract from ZIP, recompress to 7z

name: nointro-7z
description: "No-Intro 1G1R English cartridge platforms with 7z compression"

platforms:
  - nes
  - snes
  - n64
  - gb
  - gbc
  - gba
  - gamegear
  - mastersystem
  - megadrive
  - sega32x
  - sg1000
  - virtualboy
  - wswan
  - wswanc
  - msx1
  - msx2
  - nds
  - atari2600
  - atari5200
  - atari7800
  - atarijaguar
  - atarilynx
  - pcengine
  - colecovision
  - intellivision
  - ngp
  - ngpc
  - vectrex
  - pokemini
  - fds
  - supergrafx
  - sgb
  - sgb-gbc
  - gb2players
  - gbc2players

compression: "7z"
apply_lists: true
