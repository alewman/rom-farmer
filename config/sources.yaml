# Source Roots Registry
# Define base paths for ROM sources here.
# Platforms can reference these roots by name.

roots:
  # Myrient No-Intro Collection
  myrient_nointro: /path/to/source/myrient/No-Intro
  
  # Myrient Redump Collection
  myrient_redump: /path/to/source/myrient/Redump
  
  # Local ROMs
  local: /path/to/roms
  
  # Archive.org Sets
  archive_nointro: /path/to/source/archive/nointro
