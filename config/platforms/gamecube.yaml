# Nintendo GameCube Platform Configuration

name: gamecube

# DAT Configuration
dat:
  source: redump_retool_1g1r_usa
  expected_count: 600
  match_method: fuzzy_name  # RVZ hashes won't match ISO DAT hashes


# Extraction - RVZ unzip for Wii/GameCube archives
extraction:
  enabled: true
  type: rvz

# Source ROMs (Myrient RVZ format)
sources:
  - path: /data/emu/source/myrient.erista.me/files/Redump/Nintendo - GameCube - NKit RVZ [zstd-19-128k]
    type: myrient
    recursive: false

# List Files
lists:
  directory: /data/emu/lists
  patterns:
    delete: "gamecube-delete"
    add_myrient: "gamecube+*"
    add_extra: "gamecube.*"

# Multi-disc handling
multi_disc_handling: true  # GameCube has some multi-disc games

# Targets
targets:
  # RocknIX - Balanced organization
  - name: rocknix
    output_path: /data/emu/output/rocknix/gamecube
    organization:
      style: balanced
      max_files_per_group: 300
      create_subdirs: true
      subdir_prefix: "_"
    metadata: true
    enabled: true

  # Batocera - Rich organization
  - name: batocera
    output_path: /data/emu/output/1g1r-eng-7z-batocera/gamecube
    organization:
      style: flat

enabled: true

# Notes
# - GameCube RVZ files are already compressed with zstd
# - Dolphin 5.0+ loads RVZ natively, no conversion needed
# - NKit processed = verified clean dumps
# - Average game size: 500 MB - 1.4 GB (compressed RVZ)
# - Multi-disc games (e.g., Resident Evil):
#   - Disc 1 and Disc 2 are separate files
#   - Dolphin handles disc swapping via menu (no M3U needed)
# - Total GameCube library: ~1000 games, ~800 GB
