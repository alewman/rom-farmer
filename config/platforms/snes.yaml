# Super Nintendo Entertainment System Platform Configuration

name: snes
display_name: Nintendo - Super Nintendo Entertainment System

# DAT Configuration
dat:
  source: retool_1g1r_eng
  file: dats/nointro.retool.1g1r.eng/Nintendo - Super Nintendo Entertainment System (Parent-Clone) (20241224-020757) (Retool 2024-12-25 23-21-11) (886) (-n) [-AaBbcDdekMmoPrv].dat
  expected_count: 886

# Source ROMs
sources:
  - path: /data/emu/source/myrient.erista.me/files/No-Intro/Nintendo - Super Nintendo Entertainment System
    type: myrient
    recursive: false
  - path: /data/emu/source/myrient.erista.me/files/No-Intro/Nintendo - Super Nintendo Entertainment System (Private)
    type: myrient
    recursive: false

# List Files
lists:
  directory: lists
  patterns:
    delete: "snes-delete"
    add_myrient: "snes+*"
    add_extra: "snes.*"

# Extraction Configuration
extraction:
  enabled: true
  type: cartridge

# Compression Configuration
compression:
  format: 7z
  tool: /usr/bin/7z
  parameters:
    compression_level: "9"
  verify: false

# Targets
targets:
  - name: batocera
    output_path: output/1g1r-eng-7z-batocera/snes
    organization:
      style: flat
