# Super Nintendo Entertainment System Platform Configuration

name: snes
display_name: Nintendo - Super Nintendo Entertainment System

# DAT Configuration
dat:
  source: retool_1g1r_eng
  expected_count: 886

# Source ROMs
sources:
  - path: /path/to/source/No-Intro/Nintendo - Super Nintendo Entertainment System
    type: myrient
    recursive: false
  - path: /path/to/source/No-Intro/Nintendo - Super Nintendo Entertainment System (Aftermarket)
    type: myrient
    recursive: false
  - path: /path/to/source/No-Intro/Nintendo - Super Nintendo Entertainment System (Private)
    type: myrient
    recursive: false

# List Files
lists:
  directory: lists
  patterns:
    delete: "snes-delete"
    add_myrient: "snes+*"
    add_extra: "snes.*"

# Extraction Configuration
extraction:
  enabled: true
  type: cartridge

# Compression Configuration
compression:
  format: 7z
  tool: /usr/bin/7z
  parameters:
    compression_level: "9"
  verify: false

# Targets
targets:
  - name: batocera
    output_path: output/1g1r-eng-7z-batocera/snes
    organization:
      style: flat
