# Bandai WonderSwan Platform Configuration
# Workflow: Extract .ws ROMs from ZIPs → Recompress to 7z for better compression
# Expected: 38 games after Retool filtering (ENG 1G1R)

name: wswan
display_name: Bandai - WonderSwan

# DAT Configuration
dat:
  source: retool_1g1r_eng
  file: /data/emu/dats/nointro.retool.1g1r.eng/Bandai - WonderSwan (Parent-Clone) (20241208-053316) (Retool 2024-12-25 23-22-01) (38) (-n) [-AaBbcDdekMmoPrv].dat
  expected_count: 38

# Source ROMs
sources:
  - path: /data/emu/source/myrient.erista.me/files/No-Intro/Bandai - WonderSwan
    type: myrient
    recursive: false

# List Files
lists:
  directory: /data/emu/lists
  patterns:
    delete: "wswan-delete"
    add_myrient: "wswan+*"
    add_extra: "wswan.*"

# Extraction Configuration
extraction:
  enabled: true  # Extract .ws files from ZIP archives
  type: cartridge  # Cartridge-based system (not disc images)

# Multi-disc handling (not applicable for cartridge systems)
multi_disc_handling: false

# Compression Configuration
# Extract .ws from ZIP → Recompress to 7z with LZMA2 for best compression
compression:
  format: 7z  # 7z with LZMA2 compression
  tool: /usr/bin/7z
  parameters:
    compression_level: "9"  # Maximum compression
  verify: true

# Targets
targets:
  # Batocera: Flat organization with ARRM metadata (when ready)
  - name: batocera
    output_path: /data/emu/output/wswan-1g1r-eng-batocera
    organization:
      style: flat
      create_subdirs: false
    metadata: true
    enabled: true

enabled: true
