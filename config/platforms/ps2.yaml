# Sony PlayStation 2 Platform Configuration
# Disc-based system: Extract + CHD compression
# Expected: ~2,556 games after Retool filtering (ENG)

name: ps2

# DAT Configuration
dat:
  source: redump_retool_1g1r_eng
  # Auto-discovered from dats/redump.retool.1g1r.eng/
  expected_count: 2556

# Source ROMs
sources:
  - path: ${ROMFARMER_SOURCE_ROOT}/Redump/Sony - PlayStation 2
    type: myrient
    recursive: false

# List Files
lists:
  directory: lists
  patterns:
    delete: "ps2-delete"
    add_myrient: "ps2+*"
    add_extra: "ps2.*"

# Extraction - disc type for Redump systems
extraction:
  enabled: true
  type: disc

multi_disc_handling: true

# Default compression (all targets use CHD)
compression:
  format: chd
  tool: tools/bin/chdman
  parameters:
    codec: "lzma"  # Best compression for PS2
  verify: true

# Targets
targets:
  # Batocera: Flat organization with optional subdirectories from lists
  - name: batocera
    output_path: output/1g1r-eng-7z-batocera/ps2
    organization:
      style: flat
      create_subdirs: true  # Create subdirectories from list files
    metadata: true

  # RocknIX: Balanced organization
  - name: rocknix
    output_path: output/rocknix/ps2
    organization:
      style: balanced
      max_files_per_group: 100
      create_subdirs: true
      subdir_prefix: ""
    metadata: true
