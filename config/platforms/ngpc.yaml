# SNK Neo Geo Pocket Color Platform Configuration
# Workflow: Extract .ngc files from ZIPs → Recompress to 7z
# Expected: ~40 games after Retool filtering (ENG 1G1R)

name: ngpc
display_name: SNK - NeoGeo Pocket Color

# DAT Configuration
dat:
  source: retool_1g1r_eng
  # Will auto-detect DAT file based on platform name

# Source ROMs
sources:
  - path: ${ROMFARMER_SOURCE_ROOT}/No-Intro/SNK - NeoGeo Pocket Color
    type: myrient
    recursive: false

# List Files
lists:
  directory: lists
  patterns:
    delete: "ngpc-delete"
    add_myrient: "ngpc+*"
    add_extra: "ngpc.*"

# Extraction Configuration
extraction:
  enabled: true
  type: cartridge

# Compression Configuration
compression:
  format: 7z
  tool: /usr/bin/7z
  parameters:
    compression_level: "9"
  verify: false

# Targets
targets:
  # Batocera: Flat organization
  - name: batocera
    output_path: output/1g1r-eng-7z-batocera/ngpc
    organization:
      style: flat
    metadata: true
    enabled: true
