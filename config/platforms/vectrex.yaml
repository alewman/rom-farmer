# GCE Vectrex Platform Configuration
# Workflow: Extract .vec/.bin files from ZIPs → Recompress to 7z
# Expected: ~30 games after Retool filtering (ENG 1G1R)

name: vectrex
display_name: GCE - Vectrex

# DAT Configuration
dat:
  source: retool_1g1r_eng
  # Will auto-detect DAT file based on platform name

# Source ROMs
sources:
  - path: ${ROMFARMER_SOURCE_ROOT}/No-Intro/GCE - Vectrex
    type: myrient
    recursive: false

# List Files
lists:
  directory: lists
  patterns:
    delete: "vectrex-delete"
    add_myrient: "vectrex+*"
    add_extra: "vectrex.*"

# Extraction Configuration
extraction:
  enabled: true
  type: cartridge

# Compression Configuration
compression:
  format: 7z
  tool: /usr/bin/7z
  parameters:
    compression_level: "9"
  verify: false

# Targets
targets:
  # Batocera: Flat organization
  - name: batocera
    output_path: output/1g1r-eng-7z-batocera/vectrex
    organization:
      style: flat
    metadata: true
    enabled: true
