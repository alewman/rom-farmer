# ColecoVision Platform Configuration
# Workflow: Extract .col files from ZIPs → Recompress to 7z
# Expected: ~140 games after Retool filtering (ENG 1G1R)

name: colecovision
display_name: Coleco - ColecoVision

# DAT Configuration
dat:
  source: retool_1g1r_eng
  # Will auto-detect DAT file based on platform name

# Source ROMs
sources:
  - path: /data/emu/source/myrient.erista.me/files/No-Intro/Coleco - ColecoVision
    type: myrient
    recursive: false

# List Files
lists:
  directory: lists
  patterns:
    delete: "colecovision-delete"
    add_myrient: "colecovision+*"
    add_extra: "colecovision.*"

# Extraction Configuration
extraction:
  enabled: true
  type: cartridge

# Compression Configuration
compression:
  format: 7z
  tool: /usr/bin/7z
  parameters:
    compression_level: "9"
  verify: false

# Targets
targets:
  # Batocera: Flat organization
  - name: batocera
    output_path: output/1g1r-eng-7z-batocera/colecovision
    organization:
      style: flat
    metadata: true
    enabled: true
