# Nintendo Pokemon Mini Platform Configuration
# Tiny handheld with only ~10 official games, all Pokemon-themed
# Expected: 11 games after Retool filtering (ENG 1G1R)

name: pokemini
display_name: Nintendo - Pokemon Mini

# DAT Configuration
dat:
  source: retool_1g1r_eng
  platform_name: "Nintendo - Pokemon Mini"  # Match DAT filename
  expected_count: 11

# Source ROMs
sources:
  - path: /data/emu/source/myrient.erista.me/files/No-Intro/Nintendo - Pokemon Mini
    type: myrient
    recursive: false

# List Files (probably won't need any for such a small set)
lists:
  directory: lists
  patterns:
    delete: "pokemini-delete"
    add_myrient: "pokemini+*"
    add_extra: "pokemini.*"

# Extraction Configuration
extraction:
  enabled: true  # Extract .min files from ZIP archives
  type: cartridge  # Cartridge-based handheld system

# Multi-disc handling (not applicable for cartridge systems)
multi_disc_handling: false

# Compression Configuration
compression:
  format: 7z
  tool: /usr/bin/7z
  parameters:
    compression_level: "9"
  verify: true

# Targets
targets:
  - name: batocera
    output_path: output/1g1r-eng-7z-batocera/pokemini
    organization:
      style: flat
      create_subdirs: false
    metadata: true
    enabled: true
