# SNK Neo Geo Pocket Platform Configuration
# Workflow: Extract .ngp files from ZIPs → Recompress to 7z
# Expected: ~10 games after Retool filtering (ENG 1G1R)

name: ngp
display_name: SNK - NeoGeo Pocket

# DAT Configuration
dat:
  source: retool_1g1r_eng
  # Will auto-detect DAT file based on platform name

# Source ROMs
sources:
  - path: /data/emu/source/myrient.erista.me/files/No-Intro/SNK - NeoGeo Pocket
    type: myrient
    recursive: false

# List Files
lists:
  directory: lists
  patterns:
    delete: "ngp-delete"
    add_myrient: "ngp+*"
    add_extra: "ngp.*"

# Extraction Configuration
extraction:
  enabled: true
  type: cartridge

# Compression Configuration
compression:
  format: 7z
  tool: /usr/bin/7z
  parameters:
    compression_level: "9"
  verify: false

# Targets
targets:
  # Batocera: Flat organization
  - name: batocera
    output_path: output/1g1r-eng-7z-batocera/ngp
    organization:
      style: flat
    metadata: true
    enabled: true
