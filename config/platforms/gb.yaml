# Nintendo Game Boy Platform Configuration
# Workflow: Extract .gb files from ZIPs → Recompress to 7z for better compression
# Expected: 785 games after Retool filtering (ENG 1G1R)

name: gb
display_name: Nintendo - Game Boy

# DAT Configuration
dat:
  source: retool_1g1r_eng
  expected_count: 785

# Source ROMs
sources:
  - path: ${ROMFARMER_SOURCE_ROOT}/No-Intro/Nintendo - Game Boy
    type: myrient
    recursive: false
  - path: ${ROMFARMER_SOURCE_ROOT}/No-Intro/Nintendo - Game Boy (Aftermarket)
    type: myrient
    recursive: false
  - path: ${ROMFARMER_SOURCE_ROOT}/No-Intro/Nintendo - Game Boy (Private)
    type: myrient
    recursive: false

# List Files
lists:
  directory: lists
  patterns:
    delete: "gb-delete"
    add_myrient: "gb+*"
    add_extra: "gb.*"

# Extraction Configuration
extraction:
  enabled: true  # Extract .gb files from ZIP archives
  type: cartridge  # Cartridge-based handheld system

# Multi-disc handling (not applicable for cartridge systems)
multi_disc_handling: false

# Compression Configuration
# Extract .gb from ZIP → Recompress to 7z with LZMA2 for best compression
compression:
  format: 7z  # 7z with LZMA2 compression
  tool: /usr/bin/7z
  parameters:
    compression_level: "9"  # Maximum compression
  verify: true

# Targets
targets:
  # Batocera: Flat organization with ARRM metadata (when ready)
  - name: batocera
    output_path: output/1g1r-eng-7z-batocera/gb
    organization:
      style: flat
      create_subdirs: false
    metadata: true
    enabled: true

enabled: true
