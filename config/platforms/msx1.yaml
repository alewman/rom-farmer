# Microsoft MSX Platform Configuration
# Workflow: Extract .rom files from ZIPs → Recompress to 7z for better compression
# Expected: 39 games after Retool filtering (ENG 1G1R)

name: msx1
display_name: Microsoft - MSX

# DAT Configuration
dat:
  source: retool_1g1r_eng
  file: dats/nointro.retool.1g1r.eng/Microsoft - MSX (Parent-Clone) (20241023-125346) (Retool 2024-12-25 23-23-03) (39) (-n) [-AaBbcDdekMmoPrv].dat
  expected_count: 39

# Source ROMs
sources:
  - path: /data/emu/source/myrient.erista.me/files/No-Intro/Microsoft - MSX
    type: myrient
    recursive: false

# List Files
lists:
  directory: lists
  patterns:
    delete: "msx1-delete"
    add_myrient: "msx1+*"
    add_extra: "msx1.*"

# Extraction Configuration
extraction:
  enabled: true  # Extract .rom files from ZIP archives
  type: cartridge  # Cartridge-based system (not disc images)

# Multi-disc handling (not applicable for cartridge systems)
multi_disc_handling: false

# Compression Configuration
# Extract .rom from ZIP → Recompress to 7z with LZMA2 for best compression
compression:
  format: 7z  # 7z with LZMA2 compression
  tool: /usr/bin/7z
  parameters:
    compression_level: "9"  # Maximum compression
  verify: true

# Targets
targets:
  # Batocera: Flat organization with ARRM metadata (when ready)
  - name: batocera
    output_path: output/1g1r-eng-7z-batocera/msx1
    organization:
      style: flat
      create_subdirs: false
    metadata: true
    enabled: true

enabled: true
