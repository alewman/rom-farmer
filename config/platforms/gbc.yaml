# Nintendo Game Boy Color Platform Configuration
# Workflow: Extract .gbc files from ZIPs → Recompress to 7z for better compression
# Expected: 941 games after Retool filtering (ENG 1G1R)

name: gbc
display_name: Nintendo - Game Boy Color

# DAT Configuration
dat:
  source: retool_1g1r_eng
  file: dats/nointro.retool.1g1r.eng/Nintendo - Game Boy Color (Parent-Clone) (20241224-103531) (Retool 2024-12-25 23-21-15) (941) (-n) [-AaBbcDdekMmoPrv].dat
  expected_count: 941

# Source ROMs
sources:
  - path: /data/emu/source/myrient.erista.me/files/No-Intro/Nintendo - Game Boy Color
    type: myrient
    recursive: false
  - path: /data/emu/source/myrient.erista.me/files/No-Intro/Nintendo - Game Boy Color (Private)
    type: myrient
    recursive: false

# List Files
lists:
  directory: lists
  patterns:
    delete: "gbc-delete"
    add_myrient: "gbc+*"
    add_extra: "gbc.*"

# Extraction Configuration
extraction:
  enabled: true  # Extract .gbc files from ZIP archives
  type: cartridge  # Cartridge-based handheld system

# Multi-disc handling (not applicable for cartridge systems)
multi_disc_handling: false

# Compression Configuration
# Extract .gbc from ZIP → Recompress to 7z with LZMA2 for best compression
compression:
  format: 7z  # 7z with LZMA2 compression
  tool: /usr/bin/7z
  parameters:
    compression_level: "9"  # Maximum compression
  verify: true

# Targets
targets:
  # Batocera: Flat organization with ARRM metadata (when ready)
  - name: batocera
    output_path: output/1g1r-eng-7z-batocera/gbc
    organization:
      style: flat
      create_subdirs: false
    metadata: true
    enabled: true

enabled: true
