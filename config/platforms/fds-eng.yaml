# Nintendo Famicom Disk System (FDS) Platform Configuration - English 1G1R
# System Type: Simple (No-Intro, extraction only)

name: fds-eng
system_type: simple

# DAT Configuration
dat:
  source: retool_1g1r_eng
  file: /data/emu/dats/nointro.retool.1g1r.eng/Nintendo - Family Computer Disk System (FDS) (Parent-Clone) (20240718-141451) (Retool 2024-12-25 23-22-26) (6) (-n) [-AaBbcDdekMmoPrv].dat
  expected_count: 6

# Source ROMs
sources:
  - path: /data/emu/source/myrient.erista.me/files/No-Intro/Nintendo - Family Computer Disk System (FDS)
    type: myrient
    recursive: false

# List Files
lists:
  directory: /data/emu/lists
  patterns:
    delete: "fds-delete"
    add_myrient: "fds+*"
    add_extra: "fds.*"

# Extraction Settings
extraction:
  enabled: true
  type: cartridge

multi_disc_handling: false

# Compression Settings
compression:
  format: 7z
  verify: true

# Targets
targets:
  - name: batocera
    output_path: /data/emu/output/fds-eng
    organization:
      style: flat
      create_subdirs: true
    metadata: true

# Emulator Settings
emulators:
  - name: "Libretro: Nestopia (Batocera)"
    supported_formats: [".fds", ".zip", ".7z"]
    preferred_format: fds
  
  - name: "Libretro: FCEUmm (Batocera)"
    supported_formats: [".fds", ".zip", ".7z"]
    preferred_format: fds

# Verification
verification:
  hash_type: md5
  dat_verification: true
  post_compression: true
