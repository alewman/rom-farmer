# Mattel Intellivision Platform Configuration
# Workflow: Extract .int files from ZIPs → Recompress to 7z
# Expected: ~130 games after Retool filtering (ENG 1G1R)

name: intellivision
display_name: Mattel - Intellivision

# DAT Configuration
dat:
  source: retool_1g1r_eng
  # Will auto-detect DAT file based on platform name

# Source ROMs
sources:
  - path: ${ROMFARMER_SOURCE_ROOT}/No-Intro/Mattel - Intellivision
    type: myrient
    recursive: false
  - path: ${ROMFARMER_SOURCE_ROOT}/No-Intro/Mattel - Intellivision (Aftermarket)
    type: myrient
    recursive: false

# List Files
lists:
  directory: lists
  patterns:
    delete: "intellivision-delete"
    add_myrient: "intellivision+*"
    add_extra: "intellivision.*"

# Extraction Configuration
extraction:
  enabled: true
  type: cartridge

# Compression Configuration
compression:
  format: 7z
  tool: /usr/bin/7z
  parameters:
    compression_level: "9"
  verify: false

# Targets
targets:
  # Batocera: Flat organization
  - name: batocera
    output_path: output/1g1r-eng-7z-batocera/intellivision
    organization:
      style: flat
    metadata: true
    enabled: true
