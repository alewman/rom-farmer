# Sega Game Gear Platform Configuration
# Workflow: Extract .gg files from ZIPs → Recompress to 7z for better compression
# Expected: 311 games after Retool filtering (ENG 1G1R)

name: gamegear
display_name: Sega - Game Gear

# DAT Configuration
dat:
  source: retool_1g1r_eng
  file: /data/emu/dats/nointro.retool.1g1r.eng/Sega - Game Gear (Parent-Clone) (20241203-185356) (Retool 2024-12-25 23-22-39) (311) (-n) [-AaBbcDdekMmoPrv].dat
  expected_count: 311

# Source ROMs
sources:
  - path: /data/emu/source/myrient.erista.me/files/No-Intro/Sega - Game Gear
    type: myrient
    recursive: false

# List Files
lists:
  directory: /data/emu/lists
  patterns:
    delete: "gamegear-delete"
    add_myrient: "gamegear+*"
    add_extra: "gamegear.*"

# Extraction Configuration
extraction:
  enabled: true  # Extract .gg files from ZIP archives
  type: cartridge  # Cartridge-based handheld system

# Multi-disc handling (not applicable for cartridge systems)
multi_disc_handling: false

# Compression Configuration
# Extract .gg from ZIP → Recompress to 7z with LZMA2 for best compression
compression:
  format: 7z  # 7z with LZMA2 compression
  tool: /usr/bin/7z
  parameters:
    compression_level: "9"  # Maximum compression
  verify: true

# Targets
targets:
  # Batocera: Flat organization with ARRM metadata (when ready)
  - name: batocera
    output_path: /data/emu/output/1g1r-eng-7z-batocera/gamegear
    organization:
      style: flat
      create_subdirs: false
    metadata: true
    enabled: true

enabled: true
