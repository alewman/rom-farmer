# Sega 32X Platform Configuration
# Workflow: Extract .32x files from ZIPs → Recompress to 7z for better compression
# Expected: 33 games after Retool filtering (ENG 1G1R)

name: sega32x
display_name: Sega - 32X

# DAT Configuration
dat:
  source: retool_1g1r_eng
  expected_count: 33

# Source ROMs
sources:
  - path: ${ROMFARMER_SOURCE_ROOT}/No-Intro/Sega - 32X
    type: myrient
    recursive: false

# List Files
lists:
  directory: lists
  patterns:
    delete: "sega32x-delete"
    add_myrient: "sega32x+*"
    add_extra: "sega32x.*"

# Extraction Configuration
extraction:
  enabled: true  # Extract .32x files from ZIP archives
  type: cartridge  # Cartridge-based add-on system (not disc images)

# Multi-disc handling (not applicable for cartridge systems)
multi_disc_handling: false

# Compression Configuration
# Extract .32x from ZIP → Recompress to 7z with LZMA2 for best compression
compression:
  format: 7z  # 7z with LZMA2 compression
  tool: /usr/bin/7z
  parameters:
    compression_level: "9"  # Maximum compression
  verify: true

# Targets
targets:
  # Batocera: Flat organization with ARRM metadata (when ready)
  - name: batocera
    output_path: output/1g1r-eng-7z-batocera/sega32x
    organization:
      style: flat
      create_subdirs: false
    metadata: true
    enabled: true

enabled: true
