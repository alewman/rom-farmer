# NES Platform Configuration
# Cartridge-based system: No extraction needed (ZIPs stay zipped)
# Expected: ~1,761 games after Retool filtering

name: nes

# DAT Configuration
dat:
  source: retool_1g1r_eng
  # file: dats/nointro.retool.1g1r.eng/Nintendo - Nintendo Entertainment System (Headered) (Parent-Clone) (20241224-130037) (Retool 2024-12-25 23-21-56) (1,761) (-n) [-AaBbcDdekMmoPrv].dat
  expected_count: 1761

# Source ROMs
sources:
  - path: /data/emu/source/myrient.erista.me/files/No-Intro/Nintendo - Nintendo Entertainment System (Headered)
    type: myrient
    recursive: false
  - path: /data/emu/source/myrient.erista.me/files/No-Intro/Nintendo - Nintendo Entertainment System (Headered) (Aftermarket)
    type: myrient
    recursive: false
  - path: /data/emu/source/myrient.erista.me/files/No-Intro/Nintendo - Nintendo Entertainment System (Headered) (Private)
    type: myrient
    recursive: false

# List Files (inherit global, can override here)
lists:
  directory: lists
  patterns:
    delete: "nes-delete"
    add_myrient: "nes+*"
    add_extra: "nes.*"

# Extraction - disabled for cartridge systems (ZIPs stay zipped)
extraction:
  enabled: false
  type: none

multi_disc_handling: false

# Targets
targets:
  # RocknIX: Balanced organization with alphabetical grouping
  - name: rocknix
    output_path: output/rocknix/nes
    organization:
      style: balanced
      max_files_per_group: 100  # Larger than Everdrive, no SD limit
      create_subdirs: true
      subdir_prefix: ""
    metadata: true
    enabled: false  # Disabled - building Batocera only

  # Batocera: Rich organization with deep subdirs
  - name: batocera
    output_path: output/1g1r-eng-7z-batocera/nes
    organization:
      style: flat  # Flat for Batocera UI
      create_subdirs: false
    metadata: true
    enabled: true

  # Everdrive: Minimal organization with 50 file limit
  - name: everdrive
    output_path: output/everdrive/nes
    organization:
      style: minimal
      max_files_per_group: 50  # Everdrive N8 Pro limit
      create_subdirs: true
      subdir_prefix: ""
    metadata: false  # No metadata on flashcarts
    enabled: false  # Disabled for initial testing

enabled: true
