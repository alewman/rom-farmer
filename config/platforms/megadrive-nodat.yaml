name: megadrive-nodat
display_name: Sega - Mega Drive - Genesis (No DAT)

# No DAT configuration - this triggers Filter1G1RStage

# Source ROMs
sources:
  - path: /path/to/source/No-Intro/Sega - Mega Drive - Genesis
    type: myrient
    recursive: false
  - path: /path/to/source/No-Intro/Sega - Mega Drive - Genesis (Aftermarket)
    type: myrient
    recursive: false
  - path: /path/to/source/No-Intro/Sega - Mega Drive - Genesis (Private)
    type: myrient
    recursive: false

# List Files
lists:
  directory: lists
  patterns:
    delete: "megadrive-delete"
    add_myrient: "megadrive+*"
    add_extra: "megadrive.*"

# Extraction Configuration
extraction:
  enabled: true
  type: cartridge

# Compression Configuration
compression:
  format: 7z
  tool: /usr/bin/7z
  parameters:
    compression_level: "9"
  verify: false

# Targets
targets:
  - name: batocera
    output_path: output/nodat-1g1r-eng-7z-batocera/megadrive
    organization:
      style: flat
    metadata: true
