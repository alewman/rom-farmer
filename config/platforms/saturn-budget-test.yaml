# Sega Saturn Budget Test Configuration
# Tests compression ratio prediction with rating_budget strategy

name: saturn-budget-test
system_type: medium

# DAT Configuration
dat:
  source: redump_retool_1g1r_eng
  expected_count: 318

# Source ROMs
sources:
  - path: /data/emu/roms/saturn
    type: myrient
    recursive: false

# Selection: Rating-budget with 2GB limit (testing compression prediction)
selection:
  name: saturn-budget-test
  strategy: rating_budget
  max_size_gb: 2.0
  min_rating: 0.6
  pattern:
    type: glob
    value: "*USA*"

# Extraction + Compression for Redump
extract_archives: true
multi_disc_handling: true

# Default compression (CHD)
compression:
  format: chd
  tool: /usr/bin/chdman
  parameters:
    codec: "lzma"
  verify: true

# Targets
targets:
  - name: test
    output_path: /data/emu/output/test/saturn-budget
    organization:
      style: flat
      subdirs: false
      multi_disc:
        enabled: true
        format: m3u
    enabled: true
