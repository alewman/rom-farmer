# Sega Saturn Platform Configuration
# System Type: Medium (Redump, extraction + CHD compression)
# Expected: ~318 games after Retool filtering (ENG)

name: saturn
system_type: medium

# DAT Configuration
dat:
  source: redump_retool_1g1r_eng
  # file: /data/emu/dats/redump.retool.1g1r.eng/Sega - Saturn (2024-12-19 19-29-19) (Retool 2025-09-07 18-14-17) (318) (-n) [-AabBcdekmMoPrv].dat
  expected_count: 318

# Source ROMs
sources:
  - path: /data/emu/roms/saturn
    type: myrient
    recursive: false

# List Files
lists:
  directory: /data/emu/lists
  patterns:
    delete: "saturn-delete"
    add_myrient: "saturn+*"
    add_extra: "saturn.*"

# Selection filter (40GB budget using rating-based selection)
selection:
  strategy: rating_budget
  max_size_gb: 40.0

# Extraction + Compression for Redump
extract_archives: true
multi_disc_handling: true

# Default compression (all targets use CHD)
compression:
  format: chd
  tool: /usr/bin/chdman
  parameters:
    codec: "lzma"  # Best compression for Saturn
  verify: true

# Targets
targets:
  # RocknIX: Balanced organization
  - name: rocknix
    output_path: /data/emu/output/rocknix/saturn
    organization:
      style: balanced
      max_files_per_group: 100
      create_subdirs: true
      subdir_prefix: ""
    metadata: true
    enabled: true

  # Batocera: Flat organization (UI handles navigation)
  - name: batocera
    output_path: /data/emu/output/1g1r-eng-7z-batocera/saturn-redump
    organization:
      style: flat  # No subdirs - Batocera's UI is excellent
      create_subdirs: false
    metadata: true
    enabled: true

enabled: true
