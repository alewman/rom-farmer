name: atari5200
display_name: Atari 5200

dat:
  source: retool_1g1r_eng
  platform_name: "Atari - Atari 5200"

targets:
  - name: default
    output_path: output/1g1r-eng-7z-batocera/atari5200
    organization:
      style: flat
    enabled: true

sources:
  - path: /path/to/source/No-Intro/Atari - Atari 5200
    type: myrient
    recursive: false

lists:
  directory: lists
  patterns:
    delete: "atari5200-delete"
    add_myrient: "atari5200+*"
    add_extra: "atari5200.*"

extraction:
  enabled: true
  type: cartridge

compression:
  format: 7z
  tool: /usr/bin/7z
  parameters:
    compression_level: "9"
