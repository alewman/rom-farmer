# Sony PSP Minis Platform Configuration
# Small downloadable games from PSN (as tiny ISOs)
# Extraction + CHD compression

name: pspminis

# DAT Configuration
# Uses the same retooled No-Intro PSN DAT as PSP — minis are tagged with (minis) in names.
# The DAT has 731 total entries (275 minis + 456 full PSP PSN games).
# Only minis match because sources point exclusively to the Minis source directory.
dat:
  source: nointro_retool_1g1r_usa
  # Auto-discovered via dat_patterns.yaml → "playstation portable"
  expected_count: 275

# Source ROMs
sources:
  - path: /data/emu/source/myrient.erista.me/files/No-Intro/Sony - PlayStation Portable (PSN) (Minis) (Decrypted)
    type: myrient
    recursive: false

# List Files
lists:
  directory: lists
  patterns:
    delete: "pspminis-delete"
    add_myrient: "pspminis+*"
    add_extra: "pspminis.*"

# Multi-disc handling not needed for minis
multi_disc_handling: false

# Extraction - disc type for ISO-based minis
extraction:
  enabled: true
  type: disc

# Compression to CHD (minis are tiny ISOs, compress them)
compression:
  format: chd
  tool: tools/bin/chdman
  parameters:
    codec: "lzma"  # Best compression
  verify: true

# Targets
targets:
  # Batocera - PSP Minis as separate system
  - name: batocera
    output_path: output/1g1r-eng-7z-batocera/pspminis
    organization:
      style: flat
    metadata: true
    scraper:
      enabled: true
      source: screenscraper
      region_priority: ["us", "wor", "eu"]

  # RocknixOS - PSP Minis have dedicated system folder
  - name: rocknix
    output_path: output/rocknix/pspminis
    organization:
      style: flat
    metadata: true
    scraper:
      enabled: true
      source: screenscraper
      region_priority: ["us", "wor", "eu"]
