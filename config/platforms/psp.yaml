# Sony PSP Platform Configuration
# UMD disc-based system: Extract + CHD compression
# Expected: ~733 games after Retool filtering (ENG) + ~553 Minis

name: psp

# DAT Configuration
dat:
  source: redump_retool_1g1r_eng
  # Auto-discovered from dats/redump.retool.1g1r.eng/
  expected_count: 733

# Source ROMs
sources:
  - path: ${ROMFARMER_SOURCE_ROOT}/Redump/Sony - PlayStation Portable
    type: myrient
    recursive: false
  - path: ${ROMFARMER_SOURCE_ROOT}/No-Intro/Sony - PlayStation Portable (PSN) (Minis) (Decrypted)
    type: myrient
    recursive: false

# List Files
lists:
  directory: lists
  patterns:
    delete: "psp-delete"
    add_myrient: "psp+*"
    add_extra: "psp.*"

# Extraction - disc type for Redump UMD games
extraction:
  enabled: true
  type: disc

multi_disc_handling: false  # PSP uses UMD, single disc

# Default compression (CHD for better compression, PPSSPP supports it)
compression:
  format: chd
  tool: tools/bin/chdman
  parameters:
    codec: "lzma"  # Best compression for PSP ISOs
  verify: true

# Targets
targets:
  # RocknIX: Balanced organization
  - name: rocknix
    output_path: output/rocknix/psp
    organization:
      style: balanced
      max_files_per_group: 100
      create_subdirs: true
      subdir_prefix: ""
    metadata: true
    enabled: true

  # Batocera: Rich organization
  - name: batocera
    output_path: output/1g1r-eng-7z-batocera/psp
    organization:
      style: flat

enabled: true
