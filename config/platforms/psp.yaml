# Sony PSP Platform Configuration
# System Type: Medium (Redump, extraction + CSO compression)
# Expected: ~733 games after Retool filtering (ENG)

name: psp
system_type: medium

# DAT Configuration
dat:
  source: retool_1g1r_eng
  # file: /data/emu/dats/retool.redump.1g1r.eng/Sony - PlayStation Portable (2024-12-20 19-12-20) (Retool 2025-09-07 18-16-01) (733) (-n) [-AabBcdekmMoPrv].dat
  expected_count: 733

# Source ROMs
sources:
  - path: /data/emu/archive/archive.myrient.erista.me/files/Redump/Sony - PlayStation Portable
    type: myrient
    recursive: false

# List Files
lists:
  directory: /data/emu/lists
  patterns:
    delete: "psp-delete"
    add_myrient: "psp+*"
    add_extra: "psp.*"

# Extraction + Compression for Redump
extract_archives: true
multi_disc_handling: false  # PSP uses UMD, single disc

# Default compression (CSO for PSP)
compression:
  format: cso
  tool: /usr/bin/maxcso
  parameters:
    level: 9  # Max compression
  verify: true

# Targets
targets:
  # RocknIX: Balanced organization
  - name: rocknix
    output_path: /data/emu/output/rocknix/psp
    organization:
      style: balanced
      max_files_per_group: 100
      create_subdirs: true
      subdir_prefix: "_"
    metadata: true
    enabled: true

  # Batocera: Rich organization
  - name: batocera
    output_path: /data/emu/output/batocera/psp
    organization:
      style: rich
      create_subdirs: true
      subdir_prefix: "_"
    metadata: true
    enabled: false

enabled: true
