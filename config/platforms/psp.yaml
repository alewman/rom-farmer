# Sony PSP Platform Configuration
# UMD disc-based system: Extract + CHD compression
# Expected: ~733 games after Retool filtering (ENG)

name: psp

# DAT Configuration
dat:
  source: retool_1g1r_eng
  file: /data/emu/dats/redump.retool.1g1r.eng/Sony - PlayStation Portable (2024-12-20 19-12-20) (Retool 2025-09-07 18-16-01) (733) (-n) [-AabBcdekmMoPrv].dat
  expected_count: 733

# Source ROMs
sources:
  - path: /data/emu/source/myrient.erista.me/files/Redump/Sony - PlayStation Portable
    type: myrient
    recursive: false

# List Files
lists:
  directory: /data/emu/lists
  patterns:
    delete: "psp-delete"
    add_myrient: "psp+*"
    add_extra: "psp.*"

# Extraction - disc type for Redump UMD games
extraction:
  enabled: true
  type: disc

multi_disc_handling: false  # PSP uses UMD, single disc

# Default compression (CHD for better compression, PPSSPP supports it)
compression:
  format: chd
  tool: /usr/bin/chdman
  parameters:
    codec: "lzma"  # Best compression for PSP ISOs
  verify: true

# Targets
targets:
  # RocknIX: Balanced organization
  - name: rocknix
    output_path: /data/emu/output/rocknix/psp
    organization:
      style: balanced
      max_files_per_group: 100
      create_subdirs: true
      subdir_prefix: "_"
    metadata: true
    enabled: true

  # Batocera: Rich organization
  - name: batocera
    output_path: /data/emu/output/1g1r-eng-7z-batocera/psp
    organization:
      style: flat

enabled: true
