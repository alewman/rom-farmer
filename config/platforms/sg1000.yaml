# Sega SG-1000 Platform Configuration
# Workflow: Extract .sg files from ZIPs → Recompress to 7z for better compression
# Expected: 21 games after Retool filtering (ENG 1G1R)

name: sg1000
display_name: Sega - SG-1000

# DAT Configuration
dat:
  source: retool_1g1r_eng
  expected_count: 21

# Source ROMs
sources:
  - path: /data/emu/source/myrient.erista.me/files/No-Intro/Sega - SG-1000
    type: myrient
    recursive: false

# List Files
lists:
  directory: lists
  patterns:
    delete: "sg1000-delete"
    add_myrient: "sg1000+*"
    add_extra: "sg1000.*"

# Extraction Configuration
extraction:
  enabled: true  # Extract .sg files from ZIP archives
  type: cartridge  # Cartridge-based system (not disc images)

# Multi-disc handling (not applicable for cartridge systems)
multi_disc_handling: false

# Compression Configuration
# Extract .sg from ZIP → Recompress to 7z with LZMA2 for best compression
compression:
  format: 7z  # 7z with LZMA2 compression
  tool: /usr/bin/7z
  parameters:
    compression_level: "9"  # Maximum compression
  verify: true

# Targets
targets:
  # Batocera: Flat organization with ARRM metadata (when ready)
  - name: batocera
    output_path: output/1g1r-eng-7z-batocera/sg1000
    organization:
      style: flat
      create_subdirs: false
    metadata: true
    enabled: true

enabled: true
