# Nintendo Game Boy 2 Players Platform Configuration
# Link cable multiplayer games for TGBDual emulator (side-by-side GB screens)
# Expected: ~169 games (GB only, 2-player games from 1G1R)

name: gb2players
display_name: Nintendo - Game Boy (2 Players)

# Metadata settings
metadata_system: gb

# DAT Configuration - use GB 1G1R DAT
dat:
  source: retool_1g1r_eng
  platform_name: "Nintendo - Game Boy"

# Source ROMs - GB only
sources:
  - path: /path/to/source/No-Intro/Nintendo - Game Boy
    type: myrient
    recursive: false

# List Files - delete non-2-player games
lists:
  directory: lists
  patterns:
    delete: "gb2players-delete"

# Extraction Configuration
extraction:
  enabled: true
  type: cartridge

# Compression Configuration
compression:
  format: 7z
  tool: /usr/bin/7z
  parameters:
    compression_level: "9"
  verify: true

# Targets
targets:
  - name: batocera
    output_path: output/1g1r-eng-7z-batocera/gb2players
    organization:
      style: flat
      create_subdirs: false
    metadata: true
    enabled: true
