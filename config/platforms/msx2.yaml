# Microsoft MSX2 Platform Configuration
# Workflow: Extract .rom files from ZIPs → Recompress to 7z for better compression
# Expected: 7 games after Retool filtering (ENG 1G1R)

name: msx2
display_name: Microsoft - MSX2

# DAT Configuration
dat:
  source: retool_1g1r_eng
  expected_count: 7

# Source ROMs
sources:
  - path: ${ROMFARMER_SOURCE_ROOT}/No-Intro/Microsoft - MSX2
    type: myrient
    recursive: false
  - path: ${ROMFARMER_SOURCE_ROOT}/No-Intro/Microsoft - MSX2 (Aftermarket)
    type: myrient
    recursive: false

# List Files
lists:
  directory: lists
  patterns:
    delete: "msx2-delete"
    add_myrient: "msx2+*"
    add_extra: "msx2.*"

# Extraction Configuration
extraction:
  enabled: true  # Extract .rom files from ZIP archives
  type: cartridge  # Cartridge-based system (not disc images)

# Multi-disc handling (not applicable for cartridge systems)
multi_disc_handling: false

# Compression Configuration
# Extract .rom from ZIP → Recompress to 7z with LZMA2 for best compression
compression:
  format: 7z  # 7z with LZMA2 compression
  tool: /usr/bin/7z
  parameters:
    compression_level: "9"  # Maximum compression
  verify: true

# Targets
targets:
  # Batocera: Flat organization with ARRM metadata (when ready)
  - name: batocera
    output_path: output/1g1r-eng-7z-batocera/msx2
    organization:
      style: flat
      create_subdirs: false
    metadata: true
    enabled: true

enabled: true
