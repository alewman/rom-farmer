# Sega Mega CD / Sega CD Platform Configuration
# System Type: Medium (Redump, extraction + CHD compression)
# Expected: ~162 games after Retool filtering (ENG)

name: megacd
system_type: medium

# DAT Configuration
dat:
  source: redump_retool_1g1r_eng
  # file: /data/emu/dats/redump.retool.1g1r.eng/Sega - Mega CD & Sega CD (2024-12-19 19-06-07) (Retool 2025-09-07 18-15-16) (162) (-n) [-AabBcdekmMoPrv].dat
  expected_count: 162

# Source ROMs
sources:
  - path: /data/emu/source/myrient.erista.me/files/Redump/Sega - Mega CD & Sega CD
    type: myrient
    recursive: false

# List Files
lists:
  directory: /data/emu/lists
  patterns:
    delete: "megacd-delete"
    add_myrient: "megacd+*"
    add_extra: "megacd.*"

# Extraction + Compression for Redump
extract_archives: true
multi_disc_handling: true

# Default compression (all targets use CHD)
compression:
  format: chd
  tool: /usr/bin/chdman
  parameters:
    codec: "lzma"  # Best compression for Sega CD
  verify: true

# Targets
targets:
  # RocknixOS: Balanced organization
  - name: rocknix
    output_path: /data/emu/output/rocknix/megacd
    organization:
      style: balanced
      max_files_per_group: 100
      create_subdirs: true
      subdir_prefix: ""
    metadata: true
    enabled: true

  # Batocera: Flat organization
  - name: batocera
    output_path: /data/emu/output/batocera/megacd
    organization:
      style: flat
      create_subdirs: false
    metadata: true
    enabled: true

enabled: true
