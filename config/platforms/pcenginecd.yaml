# NEC PC Engine CD / TurboGrafx-CD Platform Configuration
# System Type: Medium (Redump, extraction + CHD compression)
# Expected: ~100-200 games after Retool filtering (ENG)

name: pcenginecd
system_type: medium

# DAT Configuration
dat:
  source: redump_retool_1g1r_eng
  # Will auto-detect DAT file based on platform name
  # Expected: NEC - PC Engine CD & TurboGrafx CD

# Source ROMs
sources:
  - path: /data/emu/source/myrient.erista.me/files/Redump/NEC - PC Engine CD & TurboGrafx CD
    type: myrient
    recursive: false

# List Files
lists:
  directory: /data/emu/lists
  patterns:
    delete: "pcenginecd-delete"
    add_myrient: "pcenginecd+*"
    add_extra: "pcenginecd.*"

# Extraction + Compression for Redump
extract_archives: true
multi_disc_handling: true

# Default compression (all targets use CHD)
compression:
  format: chd
  tool: /usr/bin/chdman
  parameters:
    codec: "lzma"  # Best compression for CD-based systems
  verify: true

# Targets
targets:
  # Batocera: Flat organization
  - name: batocera
    output_path: /data/emu/output/1g1r-eng-7z-batocera/pcenginecd
    organization:
      style: flat
    metadata: true
