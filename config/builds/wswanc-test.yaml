# WonderSwan Color Full Build - English 1G1R
# Purpose: Complete WonderSwan Color collection for Batocera
# Note: ARRM metadata not yet imported - can be added later

name: wswanc-test
description: Bandai WonderSwan Color - 1G1R English Retool set for Batocera
version: "1.0.0"

# Build Settings
settings:
  parallel: false
  stop_on_error: false
  cleanup_temp: true
  verification: true

# Storage Configuration
storage:
  temp_path: temp
  output_base: output

# Platforms to Process
platforms:
  - wswanc

# Platform Overrides
platform_overrides:
  wswanc:
    # Output organization
    organization:
      style: flat  # Batocera uses flat structure
    
    # Metadata - can be enabled later when ARRM data is ready
    metadata:
      enabled: false  # Not yet imported ARRM metadata
      screenscraper:
        enabled: false
    
    # Lists to apply (no Best-Games list yet)
    lists:
      delete: []
      add: []
