# Test Build - Saturn USA 10 Games
# Quick test of new selection filter

name: saturn-usa10-test
description: "Test selection filter with 10 USA Saturn games"

# Build Settings
settings:
  parallel: false
  stop_on_error: true
  cleanup_temp: false
  verification: true

# Storage Configuration
storage:
  temp_path: /data/emu/temp
  output_base: /data/emu/output
  max_temp_size_gb: 20
  max_output_size_gb: 50

platforms:
  - saturn-test-usa10

global_dat_priority:
  - redump_retool_1g1r_eng
  - redump_retool_1g1r_usa
  - redump_standard

metadata_db: /data/emu/metadata/database/romgroomer.db
