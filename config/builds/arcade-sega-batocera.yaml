# Sega Arcade Systems Build
# Naomi, Naomi 2, Atomiswave, Model 2, Model 3
# Requires CHDs for many games

name: arcade-sega-batocera
description: "Sega Arcade Systems - Naomi, Model 2/3, Atomiswave"
version: "1.0"

settings:
  parallel: false
  stop_on_error: false
  cleanup_temp: true
  verify_outputs: false

storage:
  temp_path: temp
  output_base: output/arcade-batocera
  output_template: "{platform}"

platforms:
  - naomi      # ~200 games, GD-ROM CHDs
  # - naomi2   # Skipped - only BIOS in MAME, games are in naomi.cpp driver
  - atomiswave # ~30 games, Sammy hardware
  - model2     # ~35 games, 3D arcade classics
  - model3     # ~23 games, high-end 3D (Virtua Fighter 3, Daytona 2)
  - triforce   # ~20 games, GameCube-based arcade

# Notes:
# - Many games require large CHD files (GD-ROM, HDD)
# - Model 3 requires powerful hardware for emulation
# - Uses Flycast for Naomi/Atomiswave
# - Uses Supermodel for Model 3
# - Total CHD space: ~200GB+ for full sets
