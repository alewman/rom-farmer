# Redump Test Build - Random 15 Games Per Platform
# Purpose: Test disc-based systems with CHD compression
# Limit: 15 random games per platform for quick testing

name: redump-test-15
description: "Test Redump platforms with 15 random games each"
version: "1.0"

settings:
  parallel: false
  stop_on_error: false
  cleanup_temp: true
  verify_outputs: true

storage:
  temp_path: temp
  output_base: output/redump-test-15

platforms:
  - saturn
  - psx
  - dreamcast
  - megacd
  - pcenginecd
  - psp

platform_overrides:
  saturn:
    selection:
      strategy: random
      limit: 15
    targets:
      - name: batocera
        organization: flat
        output_path: output/redump-test-15/saturn
    compression:
      format: chd
  
  psx:
    selection:
      strategy: random
      limit: 15
    targets:
      - name: batocera
        organization: flat
        output_path: output/redump-test-15/psx
    compression:
      format: chd
  
  dreamcast:
    selection:
      strategy: random
      limit: 15
    targets:
      - name: batocera
        organization: flat
        output_path: output/redump-test-15/dreamcast
    compression:
      format: chd
  
  megacd:
    selection:
      strategy: random
      limit: 15
    targets:
      - name: batocera
        organization: flat
        output_path: output/redump-test-15/megacd
    compression:
      format: chd
  
  pcenginecd:
    selection:
      strategy: random
      limit: 15
    targets:
      - name: batocera
        organization: flat
        output_path: output/redump-test-15/pcenginecd
    compression:
      format: chd
  
  psp:
    selection:
      strategy: random
      limit: 15
    targets:
      - name: batocera
        organization: flat
        output_path: output/redump-test-15/psp
    compression:
      format: chd
