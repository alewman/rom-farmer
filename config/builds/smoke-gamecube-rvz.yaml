# Smoke build — RVZ chain (source zip → .rvz extracted by the RVZ transform).
#
#   romfarmer build run smoke-gamecube-rvz --test-sample 2 --seed 1 --yes
#
# GameCube RVZ zips are ~1 GB each; the run is dominated by source I/O (the
# catalog matches by name/CRC and never hashes the RVZ payload).

name: smoke-gamecube-rvz
description: "Smoke: Redump GameCube NKit RVZ (RetroBat layout)"

target: retrobat-pc
recipes:
  - nintendo-disc-rvz
platforms:
  - gamecube

output_base: output/smoke-gamecube-rvz
