# NES Full Build - English 1G1R
# Purpose: Complete NES collection for Batocera
# Expected time: ~5-10 minutes (1,761 games, no compression needed)

name: nes-full-eng
description: Full NES English collection (USA + Europe + Australia)
version: "1.0.0"

# Build Settings
settings:
  parallel: false  # Sequential for stability
  stop_on_error: false  # Continue on errors
  cleanup_temp: true  # Clean temp after success
  verification: true  # Verify outputs

# Storage Configuration
storage:
  temp_path: /data/emu/temp
  output_base: /data/emu/output
  max_temp_size_gb: 10  # NES is small
  max_output_size_gb: 50  # Full collection

# Platforms to Process
platforms:
  - nes

# Platform config is in config/platforms/nes.yaml
# No overrides needed - using defaults

# Metadata
metadata:
  author: rom-farmer
  created: "2025-10-30"
  description: "NES English 1G1R collection with metadata"
