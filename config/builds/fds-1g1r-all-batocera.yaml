# FDS Build - All Regions Batocera
# Purpose: Famicom Disk System build pipeline with All Regions 1G1R set for Batocera

name: fds-1g1r-all-batocera
description: FDS - All Regions 1G1R Retool set for Batocera
version: "1.0.0"

# Build Settings
settings:
  parallel: false
  stop_on_error: false
  cleanup_temp: true
  verification: true

# Storage Configuration
storage:
  temp_path: temp
  output_base: output

# Platforms to Process
platforms:
  - fds
