# MAME Arcade — RetroBat PC (Network Share)
# Full MAME ROM set — zip passthrough
#
# Target:  retrobat-pc → RetroBat folder structure
# Recipe:  arcade-mame → MAME + HBMAME
#
# Output: /path/to/output/roms-retrobat/mame/
# Same ZFS pool as source, hardlinks = zero disk cost
#
# Note: HBMAME source not yet downloaded — will be skipped silently

name: arcade-mame-retrobat
description: "MAME arcade ROM set for RetroBat (network share)"

target: retrobat-pc

recipes:
  - arcade-mame

output_base: /path/to/output/roms-retrobat
