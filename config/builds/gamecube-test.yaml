# GameCube Test Build Profile

name: gamecube-test
description: "Test GameCube RVZ extraction and DAT matching"
version: "1.0-test"

# Global Settings
settings:
  parallel: false
  stop_on_error: true
  cleanup_temp: false  # Keep temp files for inspection
  verify_outputs: true
  log_level: DEBUG

# Storage
storage:
  temp_path: /data/emu/temp
  cache_path: /data/emu/.cache/romgroomer
  output_base: /data/emu/output/test
  max_temp_size: 20GB
  reserve_space: 10GB

# Platforms
platforms:
  - gamecube

# Notes
notes: |
  Quick test to verify GameCube RVZ → ISO basename matching works.
  
  The matcher should:
  1. Find ZIPs in source directory
  2. Look inside for .rvz files
  3. Match "Game Name (Region).rvz" against "Game Name (Region).iso" in DAT
  4. Use basename matching (strip extension)
  
  Expected: ~600 matches (USA 1G1R set)
