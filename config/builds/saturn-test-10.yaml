# Saturn Test Build - 10 Games
# Purpose: Validate Phase 7 integration with real ROMs
# Expected time: ~10-15 minutes

name: saturn-test-10
description: Saturn test - 30 games for validation (expanded from 10)
version: "1.1.0"

# Build Settings
settings:
  parallel: false  # Sequential for easier debugging
  stop_on_error: true  # Stop if anything fails
  cleanup_temp: false  # Keep temp files for inspection
  verification: true  # Verify outputs

# Storage Configuration
storage:
  temp_path: /data/emu/temp
  output_base: /data/emu/output
  max_temp_size_gb: 50  # Plenty for 10 games
  max_output_size_gb: 100

# Platforms to Process
platforms:
  - saturn-test

# Platform Overrides
platform_overrides:
  saturn-test:
    # Only process batocera target for this test
    targets:
      - batocera
    
    # Keep compression settings
    compression:
      format: chd
      level: 9

# Metadata
metadata:
  author: rom-farmer
  created: 2025-10-17
  purpose: Phase 8 validation test
  notes: |
    Small test build to validate:
    - Stage routing works
    - CHD compression works
    - M3U playlist generation works
    - DAT filtering works
    - Organization works
    
    Expected:
    - ~10 games processed
    - ~5-10 GB output
    - 10-15 minutes processing time

# Expected Results
expected:
  platforms: 1
  games: 30
  output_size_gb: 15
  duration_minutes: 25
