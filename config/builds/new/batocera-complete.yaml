# Batocera Complete — New Format
# Replaces: 1tb-batocera-complete.yaml (which used nested includes)
#
# This is the canonical production build: all platforms, all recipes.
# ~45 platforms processed with appropriate extraction and compression.

name: batocera-complete
description: "Complete Batocera build — all platforms, all formats"
target: batocera-pc

recipes:
  - nointro-7z           # 34 cartridge platforms → 7z
  - redump-chd           # 10 disc platforms → CHD
  - nintendo-disc-rvz    # GC, Wii, WiiU → RVZ
  - xbox-xiso            # Xbox, Xbox 360 → XISO
  - ps3-jb               # PS3 → JB folder
  - arcade-fbneo         # FBNeo, Neo Geo, Atomiswave
  - arcade-mame          # MAME, HBMAME

# No explicit platforms — uses union of all recipe platform lists
# No exclude — process everything the target device supports

post_build:
  - name: "Deduplicate with jdupes"
    command: "jdupes -r -L {output_base}"
    type: command
  - name: "Calculate total size"
    command: "du -sh {output_base}"
    type: command
