# RocknIX R36S Build — New Format
# A budget handheld build with storage constraints
#
# The R36S is a low-power device — focus on retro platforms.
# RocknIX uses zip instead of 7z for faster decompression on the handheld.

name: rocknix-r36s
description: "RocknIX build for R36S handheld (256GB)"
target: rocknix-r36s

recipes:
  - nointro-zip      # Cartridge platforms → zip (faster on handheld)
  - redump-chd       # Disc platforms → CHD
  - arcade-fbneo     # Arcade (FBNeo works well on handhelds)

# Only include platforms the R36S can emulate well
# (Device unsupported filter also applied automatically from target config)
exclude:
  - ps2          # Too demanding for R36S
  - gamecube     # Too demanding
  - wii          # Too demanding
  - wiiu         # Too demanding
  - 3ds          # Too demanding
  - xbox         # Not emulatable
  - xbox360      # Not emulatable
  - ps3          # Not emulatable

storage_budget: "256gb"
