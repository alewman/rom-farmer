# No-Intro 1G1R English Collection (7z)
# Purpose: Standardized build for cartridge systems using 7z compression
# Target: Batocera (Flat organization)

name: nointro-1g1r-eng-7z-batocera
description: "No-Intro 1G1R English collection in 7z for Batocera"
version: "1.0"

settings:
  parallel: false
  stop_on_error: false
  cleanup_temp: true
  verify_outputs: true

storage:
  temp_path: temp
  output_base: output
  # Dynamic naming template
  output_template: "{filter}-{region}-{format}-{target}/{platform}"

platforms:
  - nes
  - snes
  - n64
  - gamegear
  - gb
  - gbc
  - gba
  - sgb      # Super Game Boy subset (GB games with SGB Enhanced)
  - sgb-gbc  # Super Game Boy subset (GBC games with SGB Enhanced)
  - megadrive
  - mastersystem
  - sega32x
  - sg1000
  - virtualboy
  - wswan
  - wswanc
  - msx1
  - msx2
  - nds
  - 3ds
  - atari2600
  - atari5200
  - atari7800
  - atarijaguar
  - atarilynx
  - pcengine
  - colecovision
  - intellivision
  - ngp
  - ngpc
  - vectrex

platform_overrides:
  nes: &standard_override
    targets:
      - name: batocera
        organization: flat
    extraction:
      enabled: true
      type: cartridge
    compression:
      format: 7z
  
  snes: *standard_override
  n64: *standard_override
  gamegear: *standard_override
  gb: *standard_override
  gbc: *standard_override
  gba: *standard_override
  sgb: *standard_override      # Super Game Boy subset
  
  # Super Game Boy Color subset - output to same folder as sgb
  sgb-gbc:
    targets:
      - name: batocera
        organization: flat
        output_path: output/1g1r-eng-7z-batocera/sgb  # Map to sgb folder
    extraction:
      enabled: true
      type: cartridge
    compression:
      format: 7z
  
  megadrive: *standard_override
  mastersystem: *standard_override
  sega32x: *standard_override
  sg1000: *standard_override
  virtualboy: *standard_override
  wswan: *standard_override
  wswanc: *standard_override
  msx1: *standard_override
  msx2: *standard_override
  nds: *standard_override
  
  # 3DS needs uncompressed ROMs - Batocera/Citra only accepts: .3ds, .3dsx, .cxi, .axf, .elf
  3ds:
    targets:
      - name: batocera
        organization: flat
    extraction:
      enabled: true
      type: cartridge
    compression:
      format: none
  
  atari2600: *standard_override
  atari5200: *standard_override
  atari7800: *standard_override
  atarijaguar: *standard_override
  atarilynx: *standard_override
  pcengine: *standard_override
  colecovision: *standard_override
  intellivision: *standard_override
  ngp: *standard_override
  ngpc: *standard_override
  vectrex: *standard_override
