# RocknIX 512GB Build Configuration
# Target: RocknIX on 512GB SD card
# Focus: Balanced collection with No-Intro (cartridge) + key Redump (disc) systems

name: rocknix-512gb
description: Balanced ROM collection for RocknIX on 512GB SD card

# Platform configs to include
platforms:
  - nes
  - snes
  - gb
  - gbc
  - gba
  - genesis
  - saturn
  - psp

# Global DAT priority (platforms can override)
global_dat_priority:
  - retool_1g1r_eng  # Highest priority - pre-filtered!
  - retool_1g1r_usa  # Fallback USA-only
  - nointro_standard # Only if Retool not available
  - redump_standard  # Only if Retool not available

# Global list file configuration (platforms can override)
global_lists:
  directory: /data/emu/lists
  patterns:
    delete: "{system}-delete"
    add_myrient: "{system}+*"
    add_extra: "{system}.*"

# Workspace settings
workspace: /data/emu/rom-groomer-python
dat_directory: /data/emu/dats

# Processing settings
checkpoint_enabled: true
parallel_platforms: false  # Process platforms sequentially for now
max_workers: 4
