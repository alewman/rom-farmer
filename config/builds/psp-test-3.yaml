# PSP Test Build - 3 random games to verify ISO extraction + CHD compression
name: psp-test-3
version: "1.0"
description: "PSP test build - 3 random games"

settings:
  parallel: false
  stop_on_error: true
  verify_outputs: true
  cleanup_temp: false  # Keep temp for debugging

storage:
  work_base: temp
  output_base: output

platforms:
  - psp

# Override to select only 3 random games
overrides:
  psp:
    selection:
      strategy: random
      limit: 3
    targets:
      - name: batocera
        output_path: output/psp-test-3/psp
        organization:
          style: flat

workspace: /data/emu/rom-farmer
dat_directory: /data/emu/rom-farmer/dats
