# PS2 Full Build - English 1G1R
# Build pre-extracted PS2 collection into CHD format
# Source: /data/emu/roms/ps2 (already extracted ISOs and BIN/CUE files)

name: ps2-full-eng
version: "1.0"
description: "PlayStation 2 - English 1G1R Collection (CHD format)"

# Build Settings
settings:
  parallel: false
  stop_on_error: false
  verify_outputs: true
  cleanup_temp: true

# Storage Paths
storage:
  work_base: /data/emu/temp
  output_base: /data/emu/output
  metadata_db: /data/emu/rom-groomer-python/metadata.db

# Metadata Settings
metadata:
  scrape_source: arrm
  media_base: /data/emu/roms/ps2/media
  deduplication: true

# Platforms to Build
platforms:
  - ps2

# Global DAT Priority
global_dat_priority:
  - retool_1g1r_eng

# Workspace Configuration
workspace: /data/emu

# DAT Directory
dat_directory: /data/emu/dats
