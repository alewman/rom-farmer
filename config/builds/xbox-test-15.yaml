# Xbox Test Build - Random 15 Games Per Platform
# Purpose: Test XISO-based disc systems (Xbox, Xbox 360)
# Limit: 15 random games per platform for quick testing

name: xbox-test-15
description: "Test Xbox platforms (Xbox, Xbox 360) with 15 random games each"
version: "1.0"

settings:
  parallel: false
  stop_on_error: false
  cleanup_temp: true
  verify_outputs: true

storage:
  temp_path: temp
  output_base: output/xbox-test-15

platforms:
  - xbox
  - xbox360

platform_overrides:
  xbox:
    selection:
      strategy: random
      limit: 15
    targets:
      - name: batocera
        organization: flat
        output_path: output/xbox-test-15/xbox

  xbox360:
    selection:
      strategy: random
      limit: 15
    targets:
      - name: batocera
        organization: flat
        output_path: output/xbox-test-15/xbox360
