# PSX Full Build - English 1G1R
# Purpose: Complete PlayStation collection for Batocera
# Expected time: ~10-15 hours for full collection (1,798 games)

name: psx-full-eng
description: Full PlayStation English collection (USA + Europe + Australia)
version: "1.0.0"

# Build Settings
settings:
  parallel: false  # Sequential for stability
  stop_on_error: false  # Continue on errors
  cleanup_temp: true  # Clean temp after success
  verification: true  # Verify outputs

# Storage Configuration
storage:
  temp_path: /data/emu/temp
  output_base: /data/emu/output
  max_temp_size_gb: 200  # PSX collection is large
  max_output_size_gb: 800  # Full collection

# Platforms to Process
platforms:
  - psx

# Platform config is in config/platforms/psx.yaml
# No overrides needed - using defaults

# Metadata
metadata:
  author: rom-groomer
  created: 2025-10-27
  purpose: Full PlayStation English collection
  notes: |
    Full PSX build for Batocera:
    - DAT: retool_1g1r_eng (1,798 games)
    - Regions: USA, Europe, Australia (English)
    - Format: CHD with LZMA level 9
    - Organization: Flat (Batocera UI handles navigation)
    - Metadata: gamelist.xml generated
    
    Expected:
    - ~1,798 games
    - ~400-600 GB output (after CHD compression)
    - 10-15 hours processing time

# Expected Results
expected:
  platforms: 1
  games: 1798
  output_size_gb: 500
  duration_minutes: 720  # 12 hours

