# Xbox Full Build - Complete 1G1R English Sets
# Purpose: Full XISO-based disc systems (Xbox, Xbox 360)
# Expected: ~975 Xbox games, ~1400 Xbox 360 games

name: xbox-full
description: "Full Xbox and Xbox 360 1G1R English builds for Batocera"
version: "1.0"

settings:
  parallel: false
  stop_on_error: false
  cleanup_temp: true
  verify_outputs: true

storage:
  temp_path: temp
  output_base: output/xbox-full

platforms:
  - xbox
  - xbox360

platform_overrides:
  xbox:
    targets:
      - name: batocera
        organization: flat
        output_path: output/xbox-full/xbox

  xbox360:
    targets:
      - name: batocera
        organization: flat
        output_path: output/xbox-full/xbox360
