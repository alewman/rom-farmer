# Nintendo Disc Test Build - Random 15 Games Per Platform
# Purpose: Test RVZ-based disc systems (GameCube, Wii)
# Limit: 15 random games per platform for quick testing

name: nintendo-disc-test-15
description: "Test Nintendo disc platforms (GameCube, Wii) with 15 random games each"
version: "1.0"

settings:
  parallel: false
  stop_on_error: false
  cleanup_temp: true
  verify_outputs: true

storage:
  temp_path: temp
  output_base: output/nintendo-disc-test-15

platforms:
  - gamecube
  - wii

platform_overrides:
  gamecube:
    selection:
      strategy: random
      limit: 15
    targets:
      - name: batocera
        organization: flat
        output_path: output/nintendo-disc-test-15/gamecube

  wii:
    selection:
      strategy: random
      limit: 15
    targets:
      - name: batocera
        organization: flat
        output_path: output/nintendo-disc-test-15/wii
