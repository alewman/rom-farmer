# Generation 5 Cross-Platform Dedupe Build (PSX > Saturn)
# ============================================================
# Purpose: Build Gen 5 CD-based systems with 1G1Gen cross-platform deduplication
# 
# This build creates a space-optimized Gen 5 collection by:
# 1. Building complete 1G1R sets for PSX and Saturn independently
# 2. Applying cross-platform deduplication with PSX priority
# 3. Result: Full PSX library + Saturn exclusives only
#
# Platform Priority: PSX > Saturn
# - Games on both platforms: Keep PSX version (better 3D performance, larger library)
# - Saturn exclusives: Kept automatically (fighters, shmups, arcade ports)
#
# Expected Results:
#   PSX:    ~1,798 games (unchanged - highest priority)
#   Saturn: ~200-250 games (exclusives only, from ~318 total)
#   Total:  ~2,000 unique games
#   Savings: ~20-30% reduction vs separate builds
# ============================================================

name: gen5-dedupe-batocera
description: "Generation 5 with PSX priority (PSX full + Saturn exclusives)"
version: "1.0"

# Build settings
settings:
  parallel: false  # Sequential processing for stability
  stop_on_error: false
  cleanup_temp: true
  verify_outputs: true

# Storage paths
storage:
  temp_path: temp
  output_base: output
  # Output to: output/gen5-dedupe-batocera/
  output_template: "gen5-dedupe-{target}"

# Platforms to build (in priority order for generation filter)
platforms:
  - psx      # Priority 1 - Keep all games
  - saturn   # Priority 2 - Keep exclusives only after dedup

# Generation-based cross-platform deduplication
generation_filter:
  enabled: true
  generation: gen5  # Use Generation 5 definition from config/generations.yaml
  # Optional: Rescue specific games from removal
  # rescue_lists:
  #   saturn:  # Protect these Saturn games even if they exist on PSX
  #     - "Panzer Dragoon Saga"
  #     - "Radiant Silvergun"

# Platform-specific overrides
platform_overrides:
  # ======================================================================
  # PSX (Priority 1) - Full 1G1R English library
  # ======================================================================
  psx:
    dat:
      source: redump_retool_1g1r_eng
      expected_count: 1798
    
    sources:
      - path: /data/emu/roms/psx
        type: myrient
        recursive: false
    
    lists:
      directory: lists
      patterns:
        delete: "psx-delete"
        add_myrient: "psx+*"
        add_extra: "psx.*"
    
    extraction:
      enabled: true
      type: disc
    
    multi_disc_handling: true
    
    compression:
      format: chd
      tool: tools/bin/chdman
      parameters:
        codec: "lzma"
      verify: true
    
    targets:
      - name: batocera
        output_path: output/gen5-dedupe-batocera/psx
        organization:
          style: flat
          create_subdirs: false
        metadata: true
        enabled: true
  
  # ======================================================================
  # Saturn (Priority 2) - Will become exclusives-only after gen filter
  # ======================================================================
  saturn:
    dat:
      source: redump_retool_1g1r_eng
      expected_count: 318
    
    sources:
      - path: /data/emu/roms/saturn
        type: myrient
        recursive: false
    
    lists:
      directory: lists
      patterns:
        delete: "saturn-delete"
        add_myrient: "saturn+*"
        add_extra: "saturn.*"
    
    extraction:
      enabled: true
      type: disc
    
    multi_disc_handling: true
    
    compression:
      format: chd
      tool: tools/bin/chdman
      parameters:
        codec: "lzma"
      verify: true
    
    targets:
      - name: batocera
        output_path: output/gen5-dedupe-batocera/saturn
        organization:
          style: flat
          create_subdirs: false
        metadata: true
        enabled: true

# ============================================================
# Usage Instructions
# ============================================================
# 
# Run the build:
#   python3 build-wizard --config config/builds/gen5-dedupe-batocera.yaml
#   
# Or via CLI:
#   romgroomer build gen5-dedupe-batocera
#
# What happens:
#   1. Build PSX (all 1,798 games) -> output/gen5-dedupe-batocera/psx/
#   2. Build Saturn (all 318 games) -> output/gen5-dedupe-batocera/saturn/
#   3. Run generation filter:
#      - Compare game names across platforms
#      - Find ~100-120 games that exist on both PSX and Saturn
#      - Remove Saturn versions of these games
#      - Keep ~200-250 Saturn exclusives
#   4. Final result:
#      - PSX: 1,798 games (full library)
#      - Saturn: ~200-250 games (exclusives)
#      - Total: ~2,000 unique Gen 5 games
#
# Expected space savings:
#   - Without dedupe: ~1,798 PSX + 318 Saturn = 2,116 games (~120 GB)
#   - With dedupe: ~2,000 unique games (~105 GB)
#   - Savings: ~15 GB (12-15%)
#
# Saturn games typically removed:
#   - Multi-platform sports (FIFA, NBA, NHL)
#   - Racing games (Sega Rally, Daytona - PSX versions)
#   - Fighting games that are also on PSX (Mortal Kombat, etc.)
#
# Saturn exclusives preserved:
#   - Panzer Dragoon series (exclusive)
#   - Radiant Silvergun (exclusive)
#   - Nights into Dreams (exclusive)
#   - Sega Rally Championship (best version on Saturn)
#   - Many Japanese fighters/shmups
# ============================================================
