# Nintendo Game Boy - Test Build Configuration
# Expected: 785 English games (original Game Boy - DMG)
# Cartridge-based system with .gb extension
# Output: 7z compressed files

name: gb-test
description: Nintendo Game Boy - 1G1R English Retool set for Batocera
version: "1.0.0"

# Platforms to include in this build
platforms:
  - gb

# Metadata configuration
metadata:
  enabled: false  # Disable until ARRM metadata loaded
  scraper: arrm
  settings:
    image_preference: 
      - screenshot
      - box-2D
      - title
    video_preference:
      - video
