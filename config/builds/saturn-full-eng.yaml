# Saturn Full Build - English 1G1R
# Purpose: Complete Saturn collection for Batocera
# Expected time: ~4-6 hours for full collection

name: saturn-full-eng
description: Full Saturn English collection (USA + Europe + Australia)
version: "1.0.0"

# Build Settings
settings:
  parallel: false  # Sequential for stability
  stop_on_error: false  # Continue on errors
  cleanup_temp: true  # Clean temp after success
  verification: true  # Verify outputs

# Storage Configuration
storage:
  temp_path: /data/emu/temp
  output_base: /data/emu/output
  max_temp_size_gb: 100  # Saturn games can be large
  max_output_size_gb: 500  # Full collection

# Platforms to Process
platforms:
  - saturn

# Platform Overrides
platform_overrides:
  saturn:
    # Only process batocera target
    targets:
      - batocera
    
    # Use ENG DAT (USA + Europe + Australia)
    dat:
      source: retool_1g1r_eng
    
    # Compression settings
    compression:
      format: chd
      level: 9
      codec: lzma

# Metadata
metadata:
  author: rom-groomer
  created: 2025-10-20
  purpose: Full Saturn English collection
  notes: |
    Full Saturn build for Batocera:
    - DAT: retool_1g1r_eng (318 games)
    - Regions: USA, Europe, Australia (English)
    - Format: CHD with LZMA level 9
    - Organization: Flat (Batocera UI handles navigation)
    - Metadata: gamelist.xml generated
    
    Expected:
    - ~318 games
    - ~150-200 GB output (after CHD compression)
    - 4-6 hours processing time

# Expected Results
expected:
  platforms: 1
  games: 318
  output_size_gb: 200
  duration_minutes: 300  # 5 hours
