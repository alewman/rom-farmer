# Sega Master System - Test Build Configuration
# Expected: 495 English games (largest collection yet!)
# Cartridge-based system with .sms extension
# Output: 7z compressed files

name: mastersystem-test
description: Sega Master System - 1G1R English Retool set for Batocera
version: "1.0.0"

# Platforms to include in this build
platforms:
  - mastersystem

# Metadata configuration
metadata:
  enabled: false  # Disable until ARRM metadata loaded
  scraper: arrm
  settings:
    image_preference: 
      - screenshot
      - box-2D
      - title
    video_preference:
      - video
