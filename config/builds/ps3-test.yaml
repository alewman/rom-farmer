# PS3 Test Build - Single Game
# Tests PS3 decryption and extraction pipeline

name: ps3-test
description: "PS3 test build with Retro City Rampage DX"
version: "1.0.0"

# Build Settings
settings:
  parallel: false
  stop_on_error: true
  cleanup_temp: false  # Keep temp for debugging
  verification: false

# Storage Configuration
storage:
  temp_path: temp
  output_base: output
  max_temp_size_gb: 10
  max_output_size_gb: 5

# Platform list
platforms:
  - ps3
  
# Platform overrides for testing
platform_overrides:
  ps3:
    # Only process ps3netsrv target
    targets:
      - ps3netsrv
