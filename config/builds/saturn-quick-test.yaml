# Saturn Quick Test Build
# Fast pipeline validation with 5 smallest files

name: saturn-quick-test
description: Quick Saturn pipeline test with 5 smallest files (2-5 min)

# Build Settings
settings:
  parallel: false
  stop_on_error: true
  cleanup_temp: false
  verification: true

# Storage Configuration
storage:
  temp_path: /data/emu/temp
  output_base: /data/emu/output/test
  max_temp_size_gb: 5
  max_output_size_gb: 2

platforms:
  - saturn-quick-test

metadata_db: /data/emu/rom-farmer-python/metadata/database/romfarmer.db
