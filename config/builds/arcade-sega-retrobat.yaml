# Sega Arcade Boards — RetroBat PC (Network Share)
# Naomi, Naomi 2, Model 2, Model 3, Hikaru, Chihiro, Triforce
# MAME-sourced arcade ROM sets — zip passthrough
#
# Target:  retrobat-pc → RetroBat folder structure
# Recipe:  arcade-sega → All Sega arcade boards + Triforce
#
# Output: /path/to/output/roms-retrobat/{naomi,naomi2,model2,model3,...}/
# Same ZFS pool as source, hardlinks = zero disk cost
#
# Excluded: lindbergh, namco246 (not supported by RetroBAT)

name: arcade-sega-retrobat
description: "Sega arcade boards (Naomi, Model 2/3, etc.) for RetroBat (network share)"

target: retrobat-pc

recipes:
  - arcade-sega

exclude:
  - lindbergh
  - namco246

output_base: ${ROMFARMER_OUTPUT_ROOT}/roms-retrobat
